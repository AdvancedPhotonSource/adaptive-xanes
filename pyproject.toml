[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-xanes"
version = "0.1.0"
description = "Bayesian active learning backend for adaptive XANES sampling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "botorch==0.16.1",
    "gpytorch==1.14.3",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "torch==2.9.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

